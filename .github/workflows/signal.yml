name: Generate Signal

on:
  schedule:
    - cron: '35 18 * * *' # 00:05 in Asia/Kolkata
  workflow_dispatch:
    inputs:
      repair_today:
        description: Replace today’s artifact after a verified correction
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: daily-signal
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate Signal generator
        run: npm run signal:test

      - name: Generate Signal Artifact
        run: npm run signal:generate
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SIGNAL_REGENERATE: ${{ inputs.repair_today && 'true' || 'false' }}
          SIGNAL_REQUIRE_GROQ: 'true'
          SIGNAL_TIME_ZONE: Asia/Kolkata

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add signal/
          if git diff-index --quiet HEAD; then
            echo "No new signal data to commit."
          else
            SIGNAL_DATE=$(node -p "require('./signal/current.json').date")
            git commit -m "chore(signal): generate daily signal for ${SIGNAL_DATE}"
            git pull --rebase origin master
            git push
          fi
